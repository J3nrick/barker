    id: plakard
    attributes: { label: Aling ruta, placeholder: "SM MOLINO - TRECE" }
    validations: { required: true }
  - type: textarea
    id: wrong
    attributes: { label: Ano ang mali at ano ang tama? }
    validations: { required: true }
