name: Bagong ruta
description: May jeep na wala pa sa app
labels: [data, new-route]
body:
  - type: input
    id: plakard
    attributes: { label: Nakasulat sa plakard, placeholder: "ZAPOTE - IMUS" }
    validations: { required: true }
  - type: textarea
    id: via
    attributes: { label: Mga dinadaanan (sunod-sunod), placeholder: "Zapote\nSM Bacoor\nAguinaldo Hwy\nImus Bayan" }
    validations: { required: true }
  - type: input
    id: when
    attributes: { label: Kailan mo huling nasakyan? }
