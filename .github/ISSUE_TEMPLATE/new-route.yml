name: New route
description: A jeep, bus or UV route that isn't in the app yet
labels: [data, new-route]
body:
  - type: input
    id: plakard
    attributes: { label: Signboard text, placeholder: "ZAPOTE - IMUS" }
    validations: { required: true }
  - type: textarea
    id: via
    attributes: { label: Places it passes (in order), placeholder: "Zapote\nSM Bacoor\nAguinaldo Hwy\nImus Bayan" }
    validations: { required: true }
  - type: input
    id: when
    attributes: { label: When did you last ride it? }
