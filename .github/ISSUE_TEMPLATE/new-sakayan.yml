name: Bagong sakayan
description: May terminal o paradahan (jeep, UV, bus o tricycle) na wala pa sa app
labels: [data, new-sakayan]
body:
  - type: input
    id: name
    attributes: { label: Pangalan o tawag dito, placeholder: "Tricycle sa harap ng Puregold Bucandala" }
    validations: { required: true }
  - type: dropdown
    id: kind
    attributes:
      label: Anong sasakyan
      options: [Tricycle / TODA, Jeep, Modern jeep, UV Express, Bus, Iba pa]
    validations: { required: true }
  - type: input
    id: location
    attributes: { label: Lokasyon (lat, lng), description: Kusang napupunan kapag galing sa app., placeholder: "14.4123, 120.9456" }
    validations: { required: true }
  - type: textarea
    id: rides
    attributes: { label: Papunta saan ang mga sasakyan dito?, placeholder: "Imus Bayan\nBucandala" }
  - type: textarea
    id: notes
    attributes: { label: Iba pang detalye (oras, pamasahe, litrato) }
