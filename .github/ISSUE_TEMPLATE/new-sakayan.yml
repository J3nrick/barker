name: New ride spot
description: A terminal or stand (jeep, UV, bus or tricycle) that isn't in the app yet
labels: [data, new-sakayan]
body:
  - type: input
    id: name
    attributes: { label: Name or what people call it, placeholder: "Tricycles in front of Puregold Bucandala" }
    validations: { required: true }
  - type: dropdown
    id: kind
    attributes:
      label: What rides from here
      options: [Tricycle / TODA, Jeep, Modern jeep, UV Express, Bus, Other]
    validations: { required: true }
  - type: input
    id: location
    attributes: { label: "Location (lat, lng)", description: Filled in automatically when sent from the app., placeholder: "14.4123, 120.9456" }
    validations: { required: true }
  - type: textarea
    id: rides
    attributes: { label: Where do the rides from here go?, placeholder: "Imus Bayan\nBucandala" }
  - type: textarea
    id: notes
    attributes: { label: "Other details (hours, fare, photo)" }
