name: Signboard photo
description: Send a signboard photo for testing and correct wording
labels: [data, plakard]
body:
  - type: textarea
    id: photo
    attributes: { label: Photo, description: Drag the signboard photo here. }
    validations: { required: true }
  - type: input
    id: text
    attributes: { label: Exactly what it says, placeholder: "SM MOLINO - SM BACOOR" }
    validations: { required: true }
  - type: input
    id: where
    attributes: { label: Where you took it, placeholder: "SM Bacoor terminal" }
